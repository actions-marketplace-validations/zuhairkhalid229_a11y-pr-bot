<!doctype html>
<!-- No lang attribute            -> html-has-lang     (3.1.1) -->
<html>
<head>
  <!-- No <title>                 -> document-title    (2.4.2) -->
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; background: #fff; }
    .faint { color: #bbb; }                       /* ~1.9:1 on white -> color-contrast (1.4.3) */
    .hero {
      background-image: url("data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==");
      color: #444; padding: 8px;
    }
  </style>
</head>
<body>
  <main>
    <!-- Missing alt              -> image-alt         (1.1.1) -->
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="40" height="40">

    <!-- Input with no label      -> label             (1.3.1 / 4.1.2) -->
    <input type="text" name="email">

    <!-- Empty button             -> button-name       (4.1.2) -->
    <button></button>

    <!-- Empty link               -> link-name         (2.4.4 / 4.1.2) -->
    <a href="/somewhere"></a>

    <!-- Low contrast text        -> color-contrast    (1.4.3) -->
    <p class="faint">Terms and conditions apply to this offer.</p>

    <!-- Text over a background image: axe cannot compute contrast and files
         it under "incomplete". This is what feeds needs_review. -->
    <p class="hero">Welcome back</p>

    <!-- Rendered React-ish markup with generated id/classes: exercised by the
         fingerprint tests, harmless to axe. -->
    <div id="headlessui-menu-button-:r3:" class="css-1q2w3e sc-AxjAm Button_root__x8Kz1">
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="20" height="20">
    </div>
  </main>
</body>
</html>
